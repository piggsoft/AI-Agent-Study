server:
  port: 8080

spring:
  application:
    name: webchat-ai

  datasource:
    url: jdbc:mysql://192.168.198.3:3306/webchat?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    username: root
    password: Password@2025
    driver-class-name: com.mysql.cj.jdbc.Driver

  # OpenAI 兼容配置 (NVIDIA Build)
  ai:
    openai:
      api-key: ${GLM_API_KEY}
      base-url: https://open.bigmodel.cn/api/paas/v4
      chat:
        options:
          model: GLM-4.5-Air
          temperature: 0.7
          topP: 0.8
          maxTokens: 4096
        completions-path: /chat/completions

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.piggsoft.webchat.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.piggsoft.webchat: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.ai.openai: DEBUG
    org.springframework.http.client: DEBUG
    org.springframework.web.reactive.function.client: TRACE
